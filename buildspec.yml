version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 661805105277.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t python-app .
      - docker tag python-app:latest 661805105277.dkr.ecr.us-east-1.amazonaws.com/python-app:latest
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push 661805105277.dkr.ecr.us-east-1.amazonaws.com/python-app:latest
      - echo Writing image definitions file...
      - printf '[{"name":"python-container","imageUri":"661805105277.dkr.ecr.us-east-1.amazonaws.com/python-app:latest"}]' > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
